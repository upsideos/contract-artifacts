name: Publish EVM artifacts to npm

on:
  push:
    tags:
      - evm@*
  workflow_dispatch:
    inputs:
      npm_tag:
        description: NPM dist-tag to use (latest, beta, next, etc.)
        required: true
        type: string
        default: latest
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install CLI for pre-publish audit
        working-directory: packages/cli
        run: npm ci

      - name: Re-verify packed releases
        working-directory: packages/cli
        run: npx tsx src/cli.ts audit --config-root ../..

      - name: Determine version and dist-tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF_NAME" =~ ^evm@([0-9]+\.[0-9]+\.[0-9A-Za-z\.-]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [[ "$PKG_VERSION" != "$VERSION" ]]; then
                echo "Tag version ($VERSION) does not match package.json version ($PKG_VERSION)" >&2
                exit 1
              fi
              if [[ "$VERSION" =~ - ]]; then
                NPM_TAG="beta"
              else
                NPM_TAG="latest"
              fi
            else
              echo "Tag format must be evm@<version>" >&2
              exit 1
            fi
          else
            VERSION="$PKG_VERSION"
            NPM_TAG="${{ inputs.npm_tag }}"
          fi
          echo "new_version=v$VERSION" >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        run: npm publish --access public --tag ${{ steps.version.outputs.npm_tag }} --dry-run

      - name: Publish to npm
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm publish --access public --tag ${{ steps.version.outputs.npm_tag }}
